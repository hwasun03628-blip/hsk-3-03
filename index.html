<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#182443;background:#f4f6fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(130deg,#14295c,#3754a3);color:white;text-align:center;padding:34px 16px 30px}header .brand{font-weight:900;font-size:18px;letter-spacing:.03em}header h1{font-size:clamp(24px,5vw,35px);margin:14px 0 8px}header p{margin:0;color:#dce5ff}.wrap{max-width:850px;margin:24px auto;padding:0 15px 70px}.panel{background:white;border-radius:18px;padding:22px;box-shadow:0 6px 22px #172c6412;margin-bottom:18px}.bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.tag{display:inline-block;background:#e8eeff;color:#2949a0;padding:6px 11px;border-radius:50px;font-size:13px;font-weight:800}.muted{color:#69758b;font-size:14px}.progress{height:9px;border-radius:20px;background:#e9edf7;overflow:hidden;margin-top:14px}.progress>div{height:100%;background:#4167d9;transition:width .2s}.question{border:1px solid #e5e9f4;border-radius:15px;padding:19px;margin:15px 0}.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.han{border:0;background:transparent;font-size:34px;font-weight:850;color:#142d73;cursor:pointer;padding:6px 0}.han:hover{text-decoration:underline}.example{color:#47536c;font-size:15px;margin:4px 0 13px}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.opt{border:1px solid #dce2ef;background:#fff;border-radius:10px;text-align:left;padding:13px 12px;min-height:53px;cursor:pointer;font-size:15px;color:#26334c;line-height:1.5}.opt.selected{background:#e7eeff;border-color:#4167d9;font-weight:700}.opt:disabled{cursor:default}.opt.correct{background:#e7f7ec;border-color:#43a565}.opt.wrong{background:#fff0ee;border-color:#e3685a}.feedback{margin-top:13px;background:#fff4e8;border-left:4px solid #e6a246;padding:12px;border-radius:6px;line-height:1.7}.btns{display:flex;flex-wrap:wrap;gap:9px}.btn{border:0;border-radius:11px;padding:13px 17px;background:#2949a0;color:white;font-weight:800;font-size:15px;cursor:pointer}.btn.secondary{background:#e8edfa;color:#213d84}.btn:disabled{opacity:.45;cursor:not-allowed}.score{font-size:30px;font-weight:900;color:#233f91;margin:10px 0}.hidden{display:none!important}footer{text-align:center;color:#8791a6;font-size:13px;padding-top:20px}@media(max-width:550px){.options{grid-template-columns:1fr}.panel{padding:16px}.question{padding:15px}.han{font-size:30px}}

<header><div class="brand">합격킹 HSK</div><div style="margin-top:7px;font-weight:700">화선쌤 속사포 0-3급</div><h1>HSK 3급 필수단어 [3]</h1><p>한자를 눌러 발음을 듣고 알맞은 뜻을 골라보세요!</p></header>
<main class="wrap">
<section class="panel"><div class="bar"><span id="mode" class="tag">전체 어휘 테스트</span><span class="muted" id="count"></span></div><div class="progress"><div id="fill" style="width:0"></div></div><p class="muted">기본단어는 기본단어 뜻끼리, 결과보어는 결과보어 뜻끼리 출제됩니다. 병음은 채점 후 오답에만 표시됩니다.</p><div class="btns"><button class="btn secondary" id="previous">이전 결과 다시 보기</button><button class="btn secondary" id="retry">틀린 문제 다시 풀기</button><button class="btn secondary" id="restart">처음부터 다시 풀기</button></div></section>
<section class="panel hidden" id="summary"></section><section id="questions"></section>
<div class="panel" id="submitbox"><button class="btn" id="grade" style="width:100%">채점하기</button><p class="muted" style="text-align:center;margin-bottom:0">선택하지 않은 문제는 오답 처리됩니다.</p></div>
<footer>합격킹 HSK · 화선쌤 속사포 0-3급</footer>
</main>
<script>
const DATA=[{"id": "b0", "han": "懂", "pinyin": "dǒng", "meaning": "[동] 이해하다", "group": "basic", "speak": "懂"}, {"id": "b1", "han": "段", "pinyin": "duàn", "meaning": "[양] 단락, 구간", "group": "basic", "speak": "段"}, {"id": "b2", "han": "锻炼", "pinyin": "duànliàn", "meaning": "[동] 단련하다, 운동하다", "group": "basic", "speak": "锻炼"}, {"id": "b3", "han": "饿", "pinyin": "è", "meaning": "[형] 배고프다", "group": "basic", "speak": "饿"}, {"id": "b4", "han": "耳朵", "pinyin": "ěrduo", "meaning": "[명] 귀", "group": "basic", "speak": "耳朵"}, {"id": "b5", "han": "发", "pinyin": "fā", "meaning": "[동] 보내다", "group": "basic", "speak": "发"}, {"id": "b6", "han": "发现", "pinyin": "fāxiàn", "meaning": "[동] 발견하다, 알아채다", "group": "basic", "speak": "发现"}, {"id": "b7", "han": "方便", "pinyin": "fāngbiàn", "meaning": "[형] 편리하다", "group": "basic", "speak": "方便"}, {"id": "b8", "han": "房间", "pinyin": "fángjiān", "meaning": "[명] 방", "group": "basic", "speak": "房间"}, {"id": "b9", "han": "房子", "pinyin": "fángzi", "meaning": "[명] 집", "group": "basic", "speak": "房子"}, {"id": "b10", "han": "放", "pinyin": "fàng", "meaning": "[동] 놓다 / 넣다", "group": "basic", "speak": "放"}, {"id": "b11", "han": "放心", "pinyin": "fàngxīn", "meaning": "[동] 마음을 놓다, 안심하다", "group": "basic", "speak": "放心"}, {"id": "b12", "han": "复习", "pinyin": "fùxí", "meaning": "[동] 복습하다", "group": "basic", "speak": "复习"}, {"id": "b13", "han": "复杂", "pinyin": "fùzá", "meaning": "[형] 복잡하다", "group": "basic", "speak": "复杂"}, {"id": "b14", "han": "干净", "pinyin": "gānjìng", "meaning": "[형] 깨끗하다", "group": "basic", "speak": "干净"}, {"id": "b15", "han": "感冒", "pinyin": "gǎnmào", "meaning": "[명/동] 감기(걸리다)", "group": "basic", "speak": "感冒"}, {"id": "b16", "han": "感兴趣", "pinyin": "gǎn xìngqù", "meaning": "[동] 흥미를 느끼다, 관심을 가지다", "group": "basic", "speak": "感兴趣"}, {"id": "b17", "han": "刚才", "pinyin": "gāngcái", "meaning": "[명] 방금, 금방", "group": "basic", "speak": "刚才"}, {"id": "b18", "han": "个子", "pinyin": "gèzi", "meaning": "[명] 키", "group": "basic", "speak": "个子"}, {"id": "b19", "han": "公共汽车", "pinyin": "gōnggòng qìchē", "meaning": "[명] 버스", "group": "basic", "speak": "公共汽车"}, {"id": "b20", "han": "公交车", "pinyin": "gōngjiāochē", "meaning": "[명] 버스", "group": "basic", "speak": "公交车"}, {"id": "b21", "han": "公斤", "pinyin": "gōngjīn", "meaning": "[양] 킬로그램", "group": "basic", "speak": "公斤"}, {"id": "b22", "han": "公司", "pinyin": "gōngsī", "meaning": "[명] 회사", "group": "basic", "speak": "公司"}, {"id": "b23", "han": "狗", "pinyin": "gǒu", "meaning": "[명] 개", "group": "basic", "speak": "狗"}, {"id": "b24", "han": "故事", "pinyin": "gùshi", "meaning": "[명] 이야기", "group": "basic", "speak": "故事"}, {"id": "b25", "han": "刮风", "pinyin": "guā fēng", "meaning": "[동] 바람이 불다", "group": "basic", "speak": "刮风"}, {"id": "b26", "han": "关系", "pinyin": "guānxi", "meaning": "[명] 관계", "group": "basic", "speak": "关系"}, {"id": "b27", "han": "关心", "pinyin": "guānxīn", "meaning": "[명/동] 관심(갖다)", "group": "basic", "speak": "关心"}, {"id": "b28", "han": "关注", "pinyin": "guānzhù", "meaning": "[명/동] 관심(갖다)", "group": "basic", "speak": "关注"}, {"id": "b29", "han": "果汁", "pinyin": "guǒzhī", "meaning": "[명] 과일주스", "group": "basic", "speak": "果汁"}, {"id": "b30", "han": "过", "pinyin": "guò", "meaning": "[동] 지나다 / 건너다 / 보내다", "group": "basic", "speak": "过"}, {"id": "r0", "han": "完", "pinyin": "wán", "meaning": "다 ~하다 (완료)", "group": "result", "example": "做完了 / 没吃完", "speak": "完"}, {"id": "r1", "han": "好", "pinyin": "hǎo", "meaning": "잘 ~하다 (완료+만족)", "group": "result", "example": "准备好了 / 没卖好", "speak": "好"}, {"id": "r2", "han": "给", "pinyin": "gěi", "meaning": "~에게", "group": "result", "example": "送给朋友 / 没发给老师", "speak": "给"}, {"id": "r3", "han": "在", "pinyin": "zài", "meaning": "~에 ~한 채로 있다 (특정 장소에서 동작의 지속)", "group": "result", "example": "站在前面 / 没放在那儿", "speak": "在"}, {"id": "r4", "han": "到①", "pinyin": "dào", "meaning": "~해내다 (목적 달성)", "group": "result", "example": "买到了 / 没找到", "speak": "到"}, {"id": "r5", "han": "到②", "pinyin": "dào", "meaning": "~까지, ~로 (시간·장소 도달)", "group": "result", "example": "睡到了9点 / 没送到北京", "speak": "到"}, {"id": "r6", "han": "到③", "pinyin": "dào", "meaning": "확실히 ~했다 (확실한 결과)", "group": "result", "example": "看到了 / 没听到", "speak": "到"}, {"id": "r7", "han": "成", "pinyin": "chéng", "meaning": "~로 되다 (변화된 결과)", "group": "result", "example": "换成了 / 没变成", "speak": "成"}, {"id": "r8", "han": "错", "pinyin": "cuò", "meaning": "잘못 ~하다", "group": "result", "example": "写错了 / 没走错", "speak": "错"}, {"id": "r9", "han": "懂", "pinyin": "dǒng", "meaning": "이해하다, 감각적으로 인지하다", "group": "result", "example": "看懂了 / 没听懂", "speak": "懂"}, {"id": "r10", "han": "见", "pinyin": "jiàn", "meaning": "감각적으로 인지하다, 보거나 듣다", "group": "result", "example": "看见了 / 没听见", "speak": "见"}, {"id": "r11", "han": "清楚", "pinyin": "qīngchu", "meaning": "분명하게, 또렷하게 ~하다", "group": "result", "example": "说清楚了 / 没听清楚", "speak": "清楚"}, {"id": "r12", "han": "住", "pinyin": "zhù", "meaning": "고정시키다, 멈추다", "group": "result", "example": "抓住了 / 没记住", "speak": "住"}, {"id": "r13", "han": "上", "pinyin": "shàng", "meaning": "붙거나 닫힘, 시작", "group": "result", "example": "关上了 / 没爱上", "speak": "上"}];
const STORE='hsk_3_part3_last_v1';
const byId=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let questions=[],answers={},graded=false,wrong=[],mode='전체 어휘 테스트';
function speak(word){if(!('speechSynthesis'in window)){alert('이 브라우저에서는 음성 읽기를 지원하지 않습니다.');return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang='zh-CN';u.rate=.78;const voices=speechSynthesis.getVoices();let v=voices.find(v=>v.lang.toLowerCase().startsWith('zh-cn'))||voices.find(v=>v.lang.toLowerCase().startsWith('zh'));if(v)u.voice=v;speechSynthesis.speak(u)}
function choiceList(q){let pool=DATA.filter(x=>x.group===q.group&&x.meaning!==q.meaning);let distinct=[...new Set(pool.map(x=>x.meaning))];return shuffle([q.meaning,...shuffle(distinct).slice(0,3)])}
function start(items=DATA,label='전체 어휘 테스트'){questions=shuffle(items).map(q=>({...q,choices:choiceList(q)}));answers={};graded=false;wrong=[];mode=label;render();window.scrollTo(0,0)}
function render(){byId('mode').textContent=mode;byId('summary').classList.add('hidden');byId('submitbox').classList.remove('hidden');byId('grade').disabled=false;const root=byId('questions');root.innerHTML='';questions.forEach((q,i)=>{const el=document.createElement('article');el.className='panel question';let opts=q.choices.map((c,j)=>`<button class="opt" data-choice="${j}" type="button">${escapeHTML(c)}</button>`).join('');el.innerHTML=`<div class="qhead"><span class="tag">${q.group==='basic'?'기본단어':'결과보어'} · ${i+1}번</span><span class="muted">🔊 한자 클릭</span></div><button class="han" type="button" title="중국어 발음 듣기">${escapeHTML(q.han.replace(/[①②③]/g,''))}</button>${q.example?`<div class="example">예시: ${escapeHTML(q.example)}</div>`:''}<div class="options">${opts}</div><div class="feedback hidden"></div>`;el.querySelector('.han').addEventListener('click',()=>speak(q.speak));el.querySelectorAll('.opt').forEach((b,j)=>b.addEventListener('click',()=>{if(graded)return;answers[q.id]=q.choices[j];el.querySelectorAll('.opt').forEach(n=>n.classList.remove('selected'));b.classList.add('selected');updateProgress()}));root.appendChild(el)});updateProgress();byId('previous').disabled=!localStorage.getItem(STORE);byId('retry').disabled=true}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function updateProgress(){let n=questions.filter(q=>answers[q.id]!==undefined).length;byId('count').textContent=`${n} / ${questions.length}문제 선택`;byId('fill').style.width=`${questions.length?100*n/questions.length:0}%`}
function grade(){if(graded)return;graded=true;wrong=[];questions.forEach((q,i)=>{let correct=answers[q.id]===q.meaning;if(!correct)wrong.push(q.id);let el=byId('questions').children[i];el.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.choices[j]===q.meaning)b.classList.add('correct');if(q.choices[j]===answers[q.id]&&!correct)b.classList.add('wrong')});if(!correct){let f=el.querySelector('.feedback');f.classList.remove('hidden');f.innerHTML=`<strong>오답 · 정답 확인</strong><div>병음: ${escapeHTML(q.pinyin)}</div><div>뜻: ${escapeHTML(q.meaning)}</div>`}});let record={ids:questions.map(q=>q.id),answers:{...answers},mode,at:new Date().toLocaleString('ko-KR')};try{localStorage.setItem(STORE,JSON.stringify(record))}catch(e){}showSummary();byId('grade').disabled=true;byId('previous').disabled=false;byId('retry').disabled=wrong.length===0;window.scrollTo({top:0,behavior:'smooth'})}
function showSummary(){let correct=questions.length-wrong.length;let s=byId('summary');s.classList.remove('hidden');s.innerHTML=`<div class="tag">채점 결과</div><div class="score">${correct} / ${questions.length}문제 정답 · ${questions.length?Math.round(correct/questions.length*100):0}점</div><p class="muted">틀린 문제 ${wrong.length}개 · 틀린 문제 아래에서 병음과 뜻을 확인하세요.</p>`}
function previous(){let record;try{record=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}if(!record){alert('저장된 이전 결과가 없습니다.');return}let items=record.ids.map(id=>DATA.find(q=>q.id===id)).filter(Boolean);questions=items.map(q=>({...q,choices:choiceList(q)}));answers=record.answers||{};mode=record.mode+' · 이전 결과';graded=true;wrong=[];render();graded=true;questions.forEach((q,i)=>{let correct=answers[q.id]===q.meaning;if(!correct)wrong.push(q.id);let el=byId('questions').children[i];el.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===q.meaning)b.classList.add('correct');if(b.textContent===answers[q.id]&&!correct)b.classList.add('wrong')});if(!correct){let f=el.querySelector('.feedback');f.classList.remove('hidden');f.innerHTML=`<strong>오답 · 정답 확인</strong><div>병음: ${escapeHTML(q.pinyin)}</div><div>뜻: ${escapeHTML(q.meaning)}</div>`}});byId('submitbox').classList.add('hidden');byId('retry').disabled=wrong.length===0;showSummary();window.scrollTo(0,0)}
byId('grade').addEventListener('click',grade);byId('restart').addEventListener('click',()=>start());byId('retry').addEventListener('click',()=>{if(!graded||!wrong.length)return;start(DATA.filter(q=>wrong.includes(q.id)),'틀린 문제 다시 풀기')});byId('previous').addEventListener('click',previous);start();
</script></body></html>
